---
name: Validate

"on":
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: >-
    023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Yamllint
        run: uv run yamllint .github

      - name: Install actionlint
        run: |
          set -eu
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "${base_url}/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" |
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color

  root-python:
    name: Root Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  hosted-runtime:
    name: Hosted runtime validation (${{ matrix.agent }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: architecture-advisor
            directory: src/agents/architecture_advisor
          - agent: incident-triage
            directory: src/agents/incident_triage
    env:
      UV_PYTHON: "3.13"
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.directory }}/uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

  hosted-container:
    name: Hosted container build validation (${{ matrix.agent }})
    # The deployment path builds and pushes the same image, so this job only
    # adds value before a change reaches main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: architecture-advisor
            directory: src/agents/architecture_advisor
          - agent: incident-triage
            directory: src/agents/incident_triage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Validate hosted image build
        uses: ./.github/actions/build-hosted-image
        with:
          context: ${{ matrix.directory }}
          push: "false"
          tags: >-
            ${{ matrix.agent }}:pr-${{
            github.event.pull_request.number || github.run_id }}
          cache-scope: ${{ matrix.agent }}
