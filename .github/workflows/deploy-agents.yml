---
name: Deploy Foundry agents

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      agents:
        description: "all or a comma-separated list of registered agent names"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment
    uses: ./.github/workflows/validate.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read

  prepare:
    name: Prepare deployment matrix
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.render.outputs.matrix }}
      agents: ${{ steps.render.outputs.agents }}
      has_agents: ${{ steps.render.outputs.has_agents }}
      artifact_retention_days: >-
        ${{ steps.render.outputs.artifact_retention_days }}
      source_sha: ${{ github.sha }}
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Verify manual deployment ref
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$DEPLOYMENT_REF" != "refs/heads/main" ]; then
            printf '::error::Manual deployments must target refs/heads/main.\n'
            printf '::error::Received ref: %s\n' "$DEPLOYMENT_REF"
            exit 1
          fi

      - name: Checkout deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Collect changed paths
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          changed_paths_file="${RUNNER_TEMP}/changed-paths.txt"
          empty_sha=0000000000000000000000000000000000000000
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$empty_sha" ] ||
            ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            printf '::notice::No comparable previous commit; '
            printf 'deploying every selected agent.\n'
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE_SHA" "$SOURCE_SHA" \
            > "$changed_paths_file"
          printf 'available=true\n' >> "$GITHUB_OUTPUT"
          printf 'Changed paths compared to %s:\n' "$BEFORE_SHA"
          cat "$changed_paths_file"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync frozen runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Render deployment matrix
        id: render
        env:
          AGENT_SELECTOR: ${{ github.event.inputs.agents || 'all' }}
          CHANGED_PATHS_AVAILABLE: ${{ steps.changes.outputs.available }}
        run: |
          set -eu
          matrix_args=(
            --config .github/deployment/config.json
            --environment dev
            --agents "$AGENT_SELECTOR"
          )
          # Manual runs deploy exactly what the operator selected; pushes are
          # narrowed to the agents the commit range actually affects.
          if [ "$CHANGED_PATHS_AVAILABLE" = "true" ]; then
            matrix_args+=(
              --changed-paths-file "${RUNNER_TEMP}/changed-paths.txt"
            )
          fi
          matrix="$(uv run deployment-matrix "${matrix_args[@]}")"
          agents="$(
            printf '%s' "$matrix" |
              jq -r '[.include[].agent_name] | join(",")'
          )"
          count="$(printf '%s' "$matrix" | jq -r '.include | length')"
          retention="$(
            printf '%s' "$matrix" |
              jq -r '.include[0].artifact_retention_days // empty'
          )"
          {
            printf 'matrix=%s\n' "$matrix"
            printf 'agents=%s\n' "$agents"
            printf 'artifact_retention_days=%s\n' "$retention"
            if [ "$count" -gt 0 ]; then
              printf 'has_agents=true\n'
            else
              printf 'has_agents=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            printf '::notice::Deploying %s agent(s): %s\n' "$count" "$agents"
          else
            printf '::notice::No registered agent is affected by this '
            printf 'change; skipping deployment.\n'
          fi

  deploy:
    name: Deploy selected agents
    needs: prepare
    if: needs.prepare.outputs.has_agents == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-agent.yml
    with:
      environment: ${{ matrix.github_environment }}
      artifact_retention_days: ${{ matrix.artifact_retention_days }}
      agent_name: ${{ matrix.agent_name }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      agent_kind: ${{ matrix.agent_kind }}
      image_context: ${{ matrix.image_context }}
      image_repository: ${{ matrix.image_repository }}
      image_reference_env: ${{ matrix.image_reference_env }}
      image_digest_env: ${{ matrix.image_digest_env }}

  aggregate:
    name: Aggregate release evidence
    needs: [prepare, deploy]
    if: >-
      ${{ always() && needs.prepare.result == 'success'
      && needs.prepare.outputs.has_agents == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
      EVIDENCE_ROOT: artifacts/evidence-root
      MANIFEST_PATH: artifacts/release-manifest.json
      MANIFEST_ARTIFACT_NAME: >-
        release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync frozen runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Download deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: deployment-${{ github.run_id }}-*-attempt-*
          path: ${{ env.EVIDENCE_ROOT }}
          merge-multiple: false

      - name: Generate release manifest
        env:
          DEPLOYMENT_SHA: ${{ needs.prepare.outputs.source_sha }}
          SELECTED_AGENTS: ${{ needs.prepare.outputs.agents }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SERVER_URL: ${{ github.server_url }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
          MONITORING_URL: ${{ vars.APPLICATION_INSIGHTS_PORTAL_URL }}
          WORKFLOW_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          set -eu
          monitoring_args=()
          if [ -n "$MONITORING_URL" ]; then
            monitoring_args+=(--monitoring-url "$MONITORING_URL")
          fi
          uv run release-evidence manifest \
            --config .github/deployment/config.json \
            --environment dev \
            --agents "$SELECTED_AGENTS" \
            --evidence-root "$EVIDENCE_ROOT" \
            --output "$MANIFEST_PATH" \
            "${monitoring_args[@]}" \
            --workflow-url "$WORKFLOW_URL" \
            --repository "$RELEASE_REPOSITORY" \
            --ref "$RELEASE_REF" \
            --commit "$DEPLOYMENT_SHA" \
            --actor "$RELEASE_ACTOR" \
            --event "$RELEASE_EVENT" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --deployment-result "$DEPLOYMENT_RESULT"

      - name: Write release summary
        if: always()
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SERVER_URL: ${{ github.server_url }}
          MONITORING_URL: ${{ vars.APPLICATION_INSIGHTS_PORTAL_URL }}
          MANIFEST_ARTIFACT_NAME: >-
            release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          workflow_url = (
              f"{os.environ['RELEASE_SERVER_URL'].rstrip('/')}/"
              f"{os.environ['RELEASE_REPOSITORY']}/actions/runs/"
              f"{os.environ['RELEASE_RUN_ID']}"
          )
          monitoring_url = os.environ.get("MONITORING_URL", "").strip()
          artifact_name = os.environ["MANIFEST_ARTIFACT_NAME"]
          deployment_result = os.environ["DEPLOYMENT_RESULT"]
          lines = [
              "## Foundry deployment summary",
              "",
              f"- Overall status: `{deployment_result}`",
              f"- Current deployment matrix result: `{deployment_result}`",
          ]

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              lines.append(f"- Release manifest: unavailable ({exc})")
          else:
              overall_status = manifest.get("status", "unknown")
              if (
                  deployment_result != "success"
                  and overall_status == "succeeded"
              ):
                  overall_status = deployment_result
              lines[2] = f"- Overall status: `{overall_status}`"
              lines.extend(
                  [
                      "",
                      "| Agent | Status | Evidence attempt | "
                      "Candidate version | Image digest |",
                      "| --- | --- | --- | --- | --- |",
                  ]
              )
              for agent in manifest.get("agents", []):
                  evidence = agent.get("job_evidence") or {}
                  record = agent.get("deployment_record") or {}
                  candidate = record.get("candidate_version") or "n/a"
                  digest = (
                      evidence.get("image_digest")
                      or record.get("image_digest")
                      or "n/a"
                  )
                  status = agent.get("status", "unknown")
                  attempt = agent.get("evidence_run_attempt")
                  if attempt is None:
                      attempt_label = "n/a"
                  elif agent.get("evidence_is_current_attempt"):
                      attempt_label = f"{attempt} (current)"
                  else:
                      attempt_label = f"{attempt} (previous)"
                      if deployment_result != "success":
                          status = f"previous-attempt evidence ({status})"
                  values = [
                      agent.get("agent_name", "unknown"),
                      status,
                      attempt_label,
                      candidate,
                      digest,
                  ]
                  safe_values = [
                      str(value).replace("|", "\\|").replace("\n", " ")
                      for value in values
                  ]
                  lines.append("| " + " | ".join(safe_values) + " |")

          lines.extend(
              [
                  "",
                  f"- Release-manifest artifact: `{artifact_name}`",
                  f"- Workflow: [{workflow_url}]({workflow_url})",
                  f"- Monitoring: [{monitoring_url}]({monitoring_url})"
                  if monitoring_url
                  else "- Monitoring: not configured",
                  "",
              ]
          )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY

      - name: Enforce release status
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu
          # The manifest status already folds in the deployment matrix result,
          # so this is the single gate for the run: a missing manifest, or any
          # agent without successful evidence, fails the workflow.
          if [ ! -f "$MANIFEST_PATH" ]; then
            printf '::error::No release manifest was generated. '
            printf 'Deployment matrix result: %s\n' "$DEPLOYMENT_RESULT"
            exit 1
          fi
          status="$(jq -r '.status // ""' "$MANIFEST_PATH")"
          if [ "$status" != "succeeded" ]; then
            printf '::error::Release status is %s. ' "$status"
            printf 'Deployment matrix result: %s\n' "$DEPLOYMENT_RESULT"
            exit 1
          fi
          printf '::notice::Release status: %s\n' "$status"

      - name: Upload aggregate release manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.MANIFEST_ARTIFACT_NAME }}
          path: ${{ env.MANIFEST_PATH }}
          if-no-files-found: warn
          retention-days: >-
            ${{ needs.prepare.outputs.artifact_retention_days }}
