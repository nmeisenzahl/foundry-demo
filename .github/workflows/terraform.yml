---
name: Terraform

"on":
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

# One state file means one lock. Cancelling a run mid-apply would orphan the
# lease, so queued runs wait rather than replace each other.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      # The azurerm provider and backend exchange the Actions OIDC token
      # themselves, so no azure/login step and no az CLI are required.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_operator_object_ids: ${{ vars.AZURE_OPERATOR_OBJECT_IDS }}
      TF_IN_AUTOMATION: "true"
      SUMMARY_LIMIT: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false -lock-timeout=5m

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan \
            -input=false \
            -lock-timeout=5m \
            -var-file=env/dev.tfvars \
            -out=tfplan

      - name: Publish plan to job summary
        run: |
          set -eu
          plan_text="${RUNNER_TEMP}/plan.txt"
          terraform -chdir=infra show -no-color tfplan > "$plan_text"
          size="$(wc -c < "$plan_text")"
          {
            printf '## Terraform plan (dev)\n\n'
            printf '<details><summary>Plan output</summary>\n\n'
            printf '```terraform\n'
            head -c "$SUMMARY_LIMIT" "$plan_text"
            if [ "$size" -gt "$SUMMARY_LIMIT" ]; then
              printf '\n\n[truncated; see the Terraform plan step log]\n'
            fi
            printf '\n```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      # The azurerm provider and backend exchange the Actions OIDC token
      # themselves, so no azure/login step and no az CLI are required.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_operator_object_ids: ${{ vars.AZURE_OPERATOR_OBJECT_IDS }}
      TF_IN_AUTOMATION: "true"
      SUMMARY_LIMIT: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false -lock-timeout=5m

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan \
            -input=false \
            -lock-timeout=5m \
            -var-file=env/dev.tfvars \
            -out=tfplan

      # Applying the saved plan rather than re-planning guarantees the applied
      # change is exactly the one just rendered above.
      - name: Terraform apply
        run: |
          terraform -chdir=infra apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan

      - name: Publish apply result to job summary
        if: always()
        run: |
          set -eu
          {
            printf '## Terraform apply (dev)\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Result: `%s`\n\n' "$JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" != "success" ]; then
            exit 0
          fi
          outputs_text="${RUNNER_TEMP}/outputs.txt"
          terraform -chdir=infra output -no-color > "$outputs_text"
          {
            printf '<details><summary>Outputs</summary>\n\n'
            printf '```text\n'
            head -c "$SUMMARY_LIMIT" "$outputs_text"
            printf '\n```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
