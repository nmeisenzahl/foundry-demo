    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/src/agents/architecture_advisor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src/agents/architecture_advisor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/src/agents/incident_triage"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src/agents/incident_triage"
    schedule:
      interval: "weekly"
