---
name: Build Hosted Image
description: >-
  Build and optionally push a hosted agent image with Buildx and GHA cache

inputs:
  context:
    description: Docker build context directory
    required: true
  push:
    description: Whether to push the image to the registry (true/false)
    required: true
  tags:
    description: Image tags to apply (no latest tag allowed)
    required: true
  cache-scope:
    description: Scope key for GitHub Actions cache entries
    required: true

outputs:
  digest:
    description: Built image content digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: sh
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        set -eu

        if [ -z "$INPUT_CONTEXT" ]; then
          echo "::error::Input 'context' is required."
          exit 1
        fi

        if [ -z "$INPUT_PUSH" ]; then
          echo "::error::Input 'push' is required."
          exit 1
        fi

        case "$INPUT_PUSH" in
          true|false) ;;
          *)
            echo "::error::Input 'push' must be either 'true' or 'false'."
            exit 1
            ;;
        esac

        if [ -z "$INPUT_TAGS" ]; then
          echo "::error::Input 'tags' is required."
          exit 1
        fi

        for tag in $(printf '%s' "$INPUT_TAGS" | tr ',\n\t' '   '); do
          if [ "$tag" = "latest" ] || [ "${tag##*:}" = "latest" ]; then
            echo "::error::Tag '$tag' is not allowed. Do not publish 'latest'."
            exit 1
          fi
        done

        if [ -z "$INPUT_CACHE_SCOPE" ]; then
          echo "::error::Input 'cache-scope' is required."
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

    - name: Build hosted image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        provenance: mode=max
        sbom: true
