[project]
name = "foundry-demo-incident-triage"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # flock.application (FlockApplication), OpenTelemetry >= 1.43 and, via the
    # foundry extra, the Responses adapter with azure-ai-agentserver-responses 2.1.x.
    "flock-core[azure,foundry]==0.5.612",
    "azure-identity==1.25.3",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["../../../tests/test_hosted_runtime_incident_triage.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
