[project]
name = "foundry-demo-incident-triage"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flock-core[azure]==0.5.610",
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-agentserver-core==2.1.0",
    "azure-identity==1.25.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
# flock-core hard-pins opentelemetry api/sdk to 1.34.1, while every release of
# azure-ai-agentserver-core requires >=1.43. Both use only stable OTel 1.x APIs,
# so the newer runtime is forced here rather than forking either dependency.
override-dependencies = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    # Pulled in only by flock-core's deprecated Jaeger exporter, which caps it
    # below what the OTLP exporter needs. Nothing here exports to Jaeger.
    "googleapis-common-protos>=1.60.0",
]

[tool.pytest.ini_options]
testpaths = ["../../../tests/test_hosted_runtime_incident_triage.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
