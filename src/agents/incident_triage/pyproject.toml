[project]
name = "foundry-demo-incident-triage"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flock-core[azure,foundry]==0.5.700",
    "azure-identity==1.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["../../../tests/test_hosted_runtime_incident_triage.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
