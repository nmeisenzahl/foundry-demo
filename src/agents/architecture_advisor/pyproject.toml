[project]
name = "foundry-demo-architecture-advisor"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-core==1.17.0",
    "agent-framework-foundry==1.12.0",
    "agent-framework-foundry-hosting==1.0.0b260910",
    "azure-ai-agentserver-core==2.1.0",
    "azure-identity==1.25.3",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["../../../tests/test_hosted_runtime_architecture_advisor.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
