[project]
name = "foundry-demo"
version = "0.1.0"
description = "Local delivery for a versioned Microsoft Foundry prompt agent."
requires-python = ">=3.11,<3.12"
dependencies = [
  "azure-ai-projects==2.6.1",
  "azure-identity==1.25.3",
  "openai==3.14.1",
]

[project.scripts]
deploy-agent = "foundry_demo.delivery.cli:main"
deployment-matrix = "foundry_demo.delivery.automation:main"
release-evidence = "foundry_demo.delivery.evidence:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "yamllint==1.38.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = [
  "foundry_demo",
  "foundry_demo.agents",
  "foundry_demo.agents.common",
  "foundry_demo.agents.research_assistant",
  "foundry_demo.agents.architecture_advisor",
  "foundry_demo.agents.incident_triage",
  "foundry_demo.agents.release_notes_writer",
  "foundry_demo.delivery",
]
package-dir = { foundry_demo = "src" }

[tool.setuptools.package-data]
foundry_demo = ["agents/architecture_advisor/skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["foundry_demo"]
